services:
  api:
    build: ./server
    restart: unless-stopped
    environment:
      SIDETRAY_TEST_TOKEN: ${SIDETRAY_TEST_TOKEN:-sidetray-test-token}
    volumes:
      - api_data:/data
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      SIDETRAY_HOST: ${SIDETRAY_HOST:?set SIDETRAY_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m

volumes:
  api_data:
  caddy_data:
  caddy_config:
