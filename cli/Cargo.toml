[package]
name = "sidetray-cli"
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
description = "Side Tray dev CLI: create/join a group, approve devices, post and pull"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "sidetray"
path = "src/main.rs"

[dependencies]
sidetray-crypto = { path = "../crypto" }
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
