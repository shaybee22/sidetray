# On a v* tag: build the Windows installer, the Linux packages and the Android
# APK, sign the update bundles and the APK, and attach everything (plus
# latest.json for the desktop updater, android.json for the phone's, and the
# server's install.sh) to a draft GitHub release.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (the minisign key from
# `cargo tauri signer generate`) and TAURI_SIGNING_PRIVATE_KEY_PASSWORD;
# ANDROID_KEYSTORE_BASE64 (the release keystore, base64), ANDROID_KEYSTORE_PASSWORD
# and ANDROID_KEY_PASSWORD (key alias "sidetray").
# Optional repository variable SIDETRAY_UPDATE_URL: where installed apps look
# for latest.json (default: this repository's latest release).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
      - id: create
        name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          # Every version number must be the tag's (the APK's comes from tauri.conf.json).
          for v in \
            "$(grep -m1 '^version' app/src-tauri/Cargo.toml | cut -d'"' -f2)" \
            "$(jq -r .version app/src-tauri/tauri.conf.json)" \
            "$(grep -m1 '^version' crypto/Cargo.toml | cut -d'"' -f2)" \
            "$(grep -m1 '^version' cli/Cargo.toml | cut -d'"' -f2)" \
            "$(grep -m1 '__version__' server/app/__init__.py | cut -d'"' -f2)"; do
            [ "$v" = "$version" ] || { echo "::error::found version $v, the tag is $version"; exit 1; }
          done
          # This version's section of CHANGELOG.md as the release notes.
          awk -v v="$version" '
            /^## / { on = (index($0, "[" v "]") > 0); next }
            on' CHANGELOG.md > notes.md
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "Side Tray $version" --notes-file notes.md
          fi
          gh release upload "$TAG" install.sh --clobber
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n1)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            bundles: nsis
          - platform: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SIDETRAY_UPDATE_URL: ${{ vars.SIDETRAY_UPDATE_URL }}
        with:
          projectPath: app
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: --bundles ${{ matrix.bundles }}
          uploadUpdaterJson: true

      # A copy under a fixed name, so
      # https://github.com/shaybee22/sidetray/releases/latest/download/SideTray-Setup.exe
      # always gets the newest published installer (the README links it).
      - name: Attach SideTray-Setup.exe
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          setups=(app/src-tauri/target/release/bundle/nsis/*_"${TAG#v}"_x64-setup.exe)
          [ ${#setups[@]} -eq 1 ] || { echo "expected one installer, found: ${setups[*]}"; exit 1; }
          cp "${setups[0]}" SideTray-Setup.exe
          gh release upload "$TAG" SideTray-Setup.exe --clobber

  # The Android app: a signed release APK for arm64 phones, under a versioned
  # name and as SideTray.apk (so releases/latest/download/SideTray.apk is always
  # the newest published one), plus android.json, which installed phones read
  # to offer the update.
  android:
    needs: draft
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 27.3.13750724
      # The release keystore's certificate. Installed phones only accept updates
      # signed with it, so a build signed with anything else must not ship.
      CERT_SHA256: c2c4fcd17016295703c4d9f8e80130c0b4ff5bcb7495e1262b6675adecbb88dc
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: android

      - name: Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked

      - name: Signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_PASSWORD secrets must be set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/sidetray-android.jks"
          {
            echo "storeFile=$RUNNER_TEMP/sidetray-android.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=sidetray"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > app/src-tauri/gen/android/keystore.properties

      - name: Build the APK
        working-directory: app/src-tauri
        run: cargo tauri android build --apk --target aarch64

      - name: Check and attach the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          apk=app/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$tools/apksigner" verify --print-certs "$apk" | tee certs.txt
          grep -qi "certificate SHA-256 digest: $CERT_SHA256" certs.txt || { echo "::error::the APK isn't signed with the release key"; exit 1; }
          name=$("$tools/aapt2" dump badging "$apk" | grep -o "versionName='[^']*'" | cut -d"'" -f2)
          [ "$name" = "$version" ] || { echo "::error::the APK says version $name, the tag $version"; exit 1; }
          file="Side.Tray_${version}_arm64.apk"
          cp "$apk" "$file"
          cp "$apk" SideTray.apk
          jq -n --arg v "$version" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$file" \
            --arg sha "$(sha256sum "$file" | cut -d' ' -f1)" \
            --argjson size "$(stat -c %s "$file")" \
            '{version: $v, url: $url, sha256: $sha, size: $size}' > android.json
          cat android.json
          gh release upload "$TAG" "$file" SideTray.apk android.json --clobber
