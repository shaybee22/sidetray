[package]
name = "sidetray-app"
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
description = "Side Tray client (desktop and Android)"
license = "MIT OR Apache-2.0"
publish = false

# The app is a library so the Android build can load it (cdylib); the desktop
# binary in src/main.rs just calls run().
[lib]
name = "sidetray_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "sidetray-app"
path = "src/main.rs"

[features]
# Embed ui/ in the binary, so a plain `cargo build` gives a runnable app
# (the Tauri CLI would otherwise switch this on for release builds).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
sidetray-crypto = { path = "../../crypto" }
tauri = { version = "2.12", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
getrandom = "0.2"
zeroize = { version = "1.8", features = ["derive"] }
# rustls only, so the app trusts exactly the roots we give it (no OS store, no OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
# Photos: decode common formats, apply EXIF orientation, resize; libwebp for lossy WebP.
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
webp = { version = "0.3", default-features = false }
# Push channel (/ws). Same rustls as reqwest, with a config built from the same pinned roots.
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "__rustls-tls"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1.15.1"
webpki-roots = "1.0.11"
# sidetray://join?server=...&group=... invite links.
tauri-plugin-deep-link = "2.6.3"
# The invite link as a QR code (SVG).
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
# SHA-256 fingerprints of a test server's root certificate.
sha2 = "0.10.9"

# Desktop only: the phone has no second launch, no autostart and updates by APK (A4).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# A second launch focuses the running app (it may be hidden in the tray), and
# hands it any sidetray:// invite link it was started with.
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
# "Start with Windows" (login item on macOS, autostart entry on Linux).
tauri-plugin-autostart = "2.7.0"
tauri-plugin-updater = "2.14.1"

# Android: the device's secrets are wrapped by a Keystore key, reached over JNI.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
# Comparing the installed version with the newest release (A4).
semver = "1.0.28"
ndk-context = "0.1.1"

# Device secrets go to the OS keychain where there's a native one; elsewhere
# they stay in the local database (SPEC.md: "where available").
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
# Toasts with a click handler, under our own AppUserModelID (registered in HKCU).
tauri-winrt-notification = "0.8.1"
winreg = "0.56.0"
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

# Elsewhere notifications go through the plugin (no click handler on desktop).
[target.'cfg(not(windows))'.dependencies]
tauri-plugin-notification = "2.8.0"

# Image decoding and resizing are painfully slow unoptimised, even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
